[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendeck"
version = "0.1.0"
description = "Host bridge for the Open Deck AI-agent control surface"
readme = "../../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.scripts]
opendeck = "opendeck.cli:main"

[tool.setuptools]
packages = ["opendeck"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
